
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My New Website</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}

header {
  background: #12366b;
  color: white;
  padding: 25px;
  text-align: center;
}

main {
  max-width: 750px;
  margin: 35px auto;
  padding: 25px;
  background: white;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 3px 15px #ddd;
}

button {
  padding: 12px 25px;
  background: #1767d2;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 20px;
  color: #555;
}
</style>
</head>

<body>

<header>
  <h1>MY NEW WEBSITE</h1>
  <p>Welcome to Our Web Application</p>
</header>

<main>
  <h2>Welcome</h2>
  <p>Your new website is ready!</p>

  <button onclick="welcome()">
    Get Started
  </button>
</main>

<footer>
  Copyright 2026 | My Website
</footer>

<script>
function welcome() {
  alert("Welcome to My Website!");
}
</script>

</body>
</html>
